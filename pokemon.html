<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lista</title>
        <script>
                var pokemon = {

                nome: 'Gastly',
                numeroPokedex: 92,
                tipo: 'Fantasma',
                nivel: 10,
                vida: 30,
                energia: 2,
                altura: 1.3,
                peso: 0.1,
                forca: 20,
                defesa: 15,
                velocidade: 0,
                habilidade: 'Levitate',
                fraqueza: 'Sombrio',
                evolucao: 'Haunter',
            
                andar() {
                    alert('Gastly andou')
                    this.posicao = this.posicao + 5
                },
            
                correr() {
                    alert('Gastly correu');
                    this.velocidade = this.velocidade + 20;
                },
            
                atacar() {
                    alert('Gastly atacou');
                    this.energia = this.energia - 1;
                },
            
                comer() {
                    alert('Gastly se alimentou');
                    this.energia = this.energia + 1;
                },
            
                dormir() {
                    alert('Gastly dormiu');
                    this.energia = this.energia + 2;
                },
            
                receberDano() {
                    alert('Gastly sofreu dano');
                    this.vida = this.vida - 5;
                },
            
                treinar() {
                    alert('Gastly treinou');
                    this.nivel = this.nivel + 1;
                    this.forca = this.forca + 5;
                },
            
                descansar() {
                    alert('Gastly descansou');
                    this.vida = this.vida + 5;
                }
            }
            
            console.log(pokemon)
            
            console.log('Nome: ' + pokemon.nome);
            
            console.log('Tipo: ' + pokemon.tipo);
            
            console.log('Vida atual: ' + pokemon.vida);
            
            
            pokemon.andar();
            pokemon.correr();
            pokemon.atacar();
            pokemon.receberDano();
            pokemon.treinar();
            pokemon.comer();
            
            
            console.log('Vida depois das ações: ' + pokemon.vida);
            console.log('Energia depois das ações: ' + pokemon.energia);
            console.log('Nível depois das ações: ' + pokemon.nivel);
            console.log('Força depois das ações: ' + pokemon.forca);
            console.log('Velocidade depois das ações: ' + pokemon.velocidade);
                       
        </script>
    </head>

</html>
